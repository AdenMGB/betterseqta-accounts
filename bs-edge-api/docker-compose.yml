services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - bs-edge-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - edge-internal

  bs-edge-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "8789"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8789/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge-internal
      - zorazy_default

networks:
  edge-internal:
  zorazy_default:
    external: true

volumes:
  bs-edge-redis-data: